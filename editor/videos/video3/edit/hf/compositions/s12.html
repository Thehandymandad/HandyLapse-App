<template>
  <!-- s12 · "Commenta guida e te la mando in DM." — box commenti: GUIDA si scrive da sola su «guida» (0,49), si pubblica (0,90),
       tre puntini, risposta su «DM» (1,51); resta fermo fino alla fine (fermo finale di 0,8 s) -->
  <style>
    #root { position: absolute; inset: 0; }
    #s12-box { position: absolute; left: 146px; top: 1222px; width: 720px; height: 326px; }
    #s12-card { position: absolute; inset: 0; border-radius: 40px; background: var(--glass); border: 2px solid rgba(255,255,255,0.14);
      box-shadow: 0 40px 90px rgba(0,0,0,0.5); backdrop-filter: blur(22px); }
    #s12-head { position: absolute; left: 34px; top: 22px; font: 800 30px var(--font-display); color: #fff; letter-spacing: -0.01em; }
    #s12-head span { color: var(--muted); font-weight: 700; }
    .s12-row { position: absolute; left: 34px; right: 34px; display: flex; align-items: center; gap: 16px; }
    .s12-av { width: 54px; height: 54px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font: 900 30px var(--font-display); }
    #s12-mine { top: 78px; }
    #s12-mine .s12-av { background: var(--accent); color: var(--ink); }
    #s12-mine p { margin: 0; font: 900 40px var(--font-display); color: #fff; letter-spacing: 0.04em; }
    #s12-reply { top: 150px; }
    #s12-reply .s12-av { background: #fff; color: var(--ink); }
    #s12-bubble { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 22px 22px 22px 6px; background: rgba(255,255,255,0.12);
      font: 800 30px var(--font-display); color: #fff; white-space: nowrap; }
    #s12-dots { display: flex; gap: 9px; padding: 18px 22px; border-radius: 22px; background: rgba(255,255,255,0.12); }
    #s12-dots i { width: 13px; height: 13px; border-radius: 50%; background: #fff; }
    #s12-input { position: absolute; left: 34px; right: 120px; top: 232px; height: 70px; border-radius: 35px; border: 3px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 28px; font: 900 36px var(--font-display); color: #fff; letter-spacing: 0.06em; }
    #s12-ph { color: var(--muted); font-weight: 700; font-size: 28px; letter-spacing: 0; }
    #s12-caret { width: 4px; height: 40px; background: var(--accent); margin-left: 4px; }
    #s12-send { position: absolute; right: 34px; top: 232px; width: 70px; height: 70px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  </style>
  <div id="root" data-composition-id="s12" data-width="1080" data-height="1920">
    <div id="s12-box" class="clip" data-start="0" data-duration="3.25" data-layout-allow-overlap>
      <div id="s12-in" style="position:absolute;inset:0">
        <div id="s12-card"></div>
        <div id="s12-head">Commenti <span>· adesso</span></div>
        <div class="s12-row" id="s12-mine"><div class="s12-av">TU</div><p>GUIDA</p></div>
        <div class="s12-row" id="s12-reply"><div class="s12-av">IO</div>
          <div id="s12-dots"><i></i><i></i><i></i></div>
          <div id="s12-bubble"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M2.5 11.2L21.5 3l-6.8 18.5-3.4-7.6z" fill="#D4FF3A"/></svg>Guida inviata in DM ✓</div>
        </div>
        <div id="s12-input"><span id="s12-typed"></span><span id="s12-ph">Aggiungi un commento…</span><span id="s12-caret"></span></div>
        <div id="s12-send"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M2.5 11.2L21.5 3l-6.8 18.5-3.4-7.6z" fill="#0B0B0C"/></svg></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const TYPE = 0.49, PUB = 0.9, REPLY = 1.51, WORD = "GUIDA";
      tl.fromTo("#s12-in", { y: 140, rotationX: 40, opacity: 0, filter: "blur(14px)", transformPerspective: 1400 },
        { y: 0, rotationX: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 0.03);
      // si pubblica: il pulsante si preme, il commento sale nella lista
      tl.fromTo("#s12-send", { scale: 1 }, { scale: 0.8, duration: 0.06, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, PUB - 0.06);
      tl.fromTo("#s12-mine", { y: 150, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, PUB);
      // tre puntini, poi la risposta
      tl.fromTo("#s12-dots", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power3.out" }, 1.05);
      tl.fromTo("#s12-dots i", { y: 0 }, { y: -8, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.06, immediateRender: false }, 1.12);
      tl.to("#s12-dots", { opacity: 0, scale: 0.6, duration: 0.08 }, REPLY - 0.06);
      tl.fromTo("#s12-bubble", { x: -40, opacity: 0, scale: 0.7 }, { x: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, REPLY);
      tl.fromTo("#s12-reply .s12-av", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.05);
      tl.to("#s12-card", { borderColor: "#D4FF3A", duration: 0.15 }, REPLY);
      tl.set({}, {}, 3.25);
      window.__timelines["s12"] = tl;
      // digitazione: una lettera ogni 2 fotogrammi, cursore che lampeggia, funzione del tempo della scena
      const typed = document.getElementById("s12-typed"), ph = document.getElementById("s12-ph"), caret = document.getElementById("s12-caret");
      const bubbleRow = document.getElementById("s12-bubble");
      window.addEventListener("hf-seek", () => {
        const t = tl.time();
        const n = t < TYPE ? 0 : t >= PUB ? 0 : Math.min(WORD.length, Math.floor((t - TYPE) / 0.067) + 1);
        typed.textContent = WORD.slice(0, n);
        ph.style.display = n === 0 ? "inline" : "none";
        caret.style.opacity = t < TYPE || t >= PUB ? "0" : Math.floor(t / 0.25) % 2 ? "0.2" : "1";
        bubbleRow.style.display = t >= REPLY ? "flex" : "none";
        document.getElementById("s12-dots").style.display = t >= REPLY ? "none" : "flex";
      });
    })();
  </script>
</template>
