  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const CHECKS = [1.2, 2.64, 3.88, 4.3];
      // 1. solo il file grezzo (su «grezzo»)
      tl.fromTo("#s05-file", { y: 120, scale: 1.3, opacity: 0, filter: "blur(12px)" }, { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(1.4)" }, 0.5);
      // 2. la card si apre sotto (su «lui»), poi il resto entra uno alla volta
      tl.fromTo("#s05-glass", { scaleY: 0.25, opacity: 0, transformOrigin: "50% 0%" }, { scaleY: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.98);
      tl.fromTo(["#s05-pct", "#s05-bar"], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.08);
      tl.fromTo(".s05-it", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.05, ease: "power3.out" }, 1.0);
      tl.set("#s05-fill", { scaleX: 0 }, 0);
      CHECKS.forEach((t, i) => {
        const it = "#s05-i" + i;
        tl.to(it + " .s05-box", { backgroundColor: "#D4FF3A", duration: 0.08, ease: "none" }, t);
        tl.fromTo(it + " .s05-box", { scale: 1.3 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t);
        tl.set(it + " path", { opacity: 1 }, t + 0.03);
        tl.to(it + " path", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, t + 0.03);
        tl.to(it, { color: "#FFFFFF", duration: 0.12 }, t);
        tl.to("#s05-fill", { scaleX: (i + 1) / CHECKS.length, duration: 0.3, ease: "power3.out" }, t);
      });
      // a 100%: la card si accende
      tl.to("#s05-glass", { borderColor: "#D4FF3A", boxShadow: "0 40px 90px rgba(0,0,0,0.5), 0 0 60px rgba(212,255,58,0.55)", duration: 0.15 }, 4.3);
      tl.to("#s05-pct", { color: "#D4FF3A", duration: 0.12 }, 4.3);
      tl.to("#s05-card", { opacity: 0, y: 40, filter: "blur(12px)", duration: 0.2, ease: "power2.in" }, 4.6);
      window.__timelines["s05"] = tl;
      // la percentuale segue le spunte (funzione del tempo della scena)
      const pct = document.getElementById("s05-pct");
      window.addEventListener("hf-seek", () => {
        const t = tl.time();
        const done = CHECKS.filter((c) => t >= c).length;
        const next = CHECKS[done];
        // 25% per spunta, e nei 0,6 s prima della prossima sale piano verso di lei
        let p = done * 25;
        if (next !== undefined && t >= 1.0 && t >= next - 0.6) p += Math.round(((t - (next - 0.6)) / 0.6) * 20);
        pct.textContent = p + "%";
      });
    })();
  </script>
