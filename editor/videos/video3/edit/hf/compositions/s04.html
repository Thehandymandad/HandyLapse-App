<template>
  <script src="assets/lib/three.min.js"></script>
  <script src="assets/lib/hf3d.js"></script>
  <!-- s04 · "Così ho costruito un editor con Claude Code." — cubo 3D che si costruisce su «costruito» (0,39), cade e atterra su «Claude» (1,47); pillola su «Code» (1,75) -->
  <style>
    #root { position: absolute; inset: 0; }
    #s04-wrap { position: absolute; left: 140px; top: 1150px; width: 560px; height: 480px; }
    #s04-cv { position: absolute; inset: 0; width: 560px; height: 480px; }
    #s04-tag { position: absolute; left: 600px; top: 1355px; padding: 16px 26px; border-radius: 999px; background: var(--accent); color: var(--ink);
      font: 700 30px var(--font-mono); letter-spacing: 0.08em; white-space: nowrap; box-shadow: 0 20px 50px rgba(0,0,0,0.45); }
  </style>
  <div id="root" data-composition-id="s04" data-width="1080" data-height="1920">
    <div id="s04-wrap" class="clip" data-start="0.35" data-duration="2.1">
      <canvas id="s04-cv" width="560" height="480"></canvas>
    </div>
    <div id="s04-tag" class="clip" data-start="1.7" data-duration="0.75">CLAUDE CODE</div>
  </div>
  <script>
    (function () {
      const { E, mount, roundedBox, contactShadow, canvasTexture } = window.HF3D;
      const tl = gsap.timeline({ paused: true });
      const LAND = 1.47;
      tl.fromTo("#s04-tag", { x: -40, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 1.75);
      tl.to("#s04-tag", { opacity: 0, y: 24, duration: 0.14, ease: "power2.in" }, 2.3);
      // la timeline deve coprire tutta la scena anche dove c'è solo il 3D
      tl.set({}, {}, 2.45);
      window.__timelines["s04"] = tl;

      const canvas = document.getElementById("s04-cv");
      mount({
        key: "s04-cubo", tl, canvas, w: 560, h: 480, fov: 30, camZ: 7.4,
        build: (scene) => {
          const body = new THREE.MeshStandardMaterial({ color: 0x0f1012, roughness: 0.28, metalness: 0.25 });
          const cube = new THREE.Mesh(roundedBox(2.2, 2.2, 2.2, 0.28, 8), body);
          // asterisco corallo luminoso sulla faccia frontale (otto raggi arrotondati + alone)
          const star = canvasTexture(512, 512, (c, w, h) => {
            const g = c.createRadialGradient(256, 256, 20, 256, 256, 250);
            g.addColorStop(0, "rgba(217,119,87,0.55)");
            g.addColorStop(1, "rgba(217,119,87,0)");
            c.fillStyle = g; c.fillRect(0, 0, w, h);
            c.translate(256, 256); c.strokeStyle = "#F2A385"; c.lineCap = "round"; c.lineWidth = 30;
            c.shadowColor = "#D97757"; c.shadowBlur = 40;
            for (let i = 0; i < 8; i++) { c.rotate(Math.PI / 4); c.beginPath(); c.moveTo(0, 26); c.lineTo(0, 150); c.stroke(); }
          });
          const face = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.9), new THREE.MeshBasicMaterial({ map: star, transparent: true, depthWrite: false }));
          face.position.z = 1.105;
          cube.add(face);
          const group = new THREE.Group();
          group.add(cube);
          const shadow = contactShadow(3.6);
          shadow.position.set(0, -1.55, -1);
          scene.add(shadow);
          scene.add(group);
          return { group, cube, shadow };
        },
        draw: (t, { group, cube, shadow }) => {
          // costruzione: cresce ruotando sopra la pila d'aria, sospesa; poi cade e atterra sulla parola
          const grow = E.outCubic(E.u(t, 0.39, 0.85));
          const hover = 0.95 + 0.08 * Math.sin(t * 5);
          let y = t < 1.3 ? hover : t < LAND ? E.lerp(hover, 0, E.inQuad((t - 1.3) / (LAND - 1.3))) : -0.14 * E.bounce(t - LAND, 12, 6);
          const exit = E.u(t, 2.25, 2.45);
          y += 1.4 * E.inQuad(exit);
          group.position.set(-0.35, y + 0.05, 0);
          const spin = t < LAND ? (1 - E.outCubic(E.u(t, 0.39, LAND))) * 5.2 : 0;
          cube.rotation.set(0.32 + spin * 0.18, -0.42 + spin + 0.06 * Math.sin(t * 1.7), 0.05 * Math.sin(t * 2.1));
          const squash = t >= LAND ? 1 + 0.12 * E.bounce(t - LAND, 20, 9) : 1;
          const s = Math.max(0.001, grow * (1 - 0.4 * exit));
          group.scale.set(s / Math.sqrt(squash), s * squash, s / Math.sqrt(squash));
          shadow.update(y);
          shadow.material.opacity *= grow * (1 - exit);
          canvas.style.opacity = String(1 - exit);
        },
      });
    })();
  </script>
</template>
