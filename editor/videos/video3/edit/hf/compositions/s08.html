<template>
  <!-- s08 · "L'ho registrato io e gliel'ho mandato…" — aeroplanino di carta che aspetta; su «mandato» (1,22) parte in curva con la scia lime; «✓ INVIATO» (1,52) -->
  <style>
    #root { position: absolute; inset: 0; }
    #s08-svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    #s08-plane { position: absolute; left: 0; top: 0; width: 170px; height: 170px; margin: -85px 0 0 -85px; }
    #s08-chip { position: absolute; left: 506px; top: 1470px; display: flex; align-items: center; gap: 14px; padding: 16px 34px; border-radius: 999px;
      background: var(--accent); color: var(--ink); font: 900 46px var(--font-display); letter-spacing: 0.04em; white-space: nowrap;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
  </style>
  <div id="root" data-composition-id="s08" data-width="1080" data-height="1920">
    <svg id="s08-svg" class="clip" data-start="0" data-duration="2.65" viewBox="0 0 1080 1920" data-layout-ignore>
      <!-- traiettoria: dal basso a sinistra, ricciolo sotto, poi fuori in alto a destra (lontano dal viso) -->
      <path id="s08-path" d="M250 1430 C 520 1600, 860 1520, 880 1300 S 1010 1000, 1240 760" fill="none" stroke="none"/>
      <path id="s08-trail" d="M250 1430 C 520 1600, 860 1520, 880 1300 S 1010 1000, 1240 760" fill="none" stroke="#D4FF3A" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="22 18" opacity="0.9"/>
    </svg>
    <svg id="s08-plane" class="clip" data-start="0.3" data-duration="1.95" viewBox="0 0 24 24">
      <path d="M2.5 11.2L21.5 3l-6.8 18.5-3.4-7.6z" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M11.3 13.9L21.5 3l-10.2 10.9-1 5.6z" fill="#C9CDD4"/>
    </svg>
    <div id="s08-chip" class="clip" data-start="1.5" data-duration="1.15">
      <svg width="46" height="46" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#0B0B0C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>INVIATO
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const GO = 1.22, FLY = 0.8;
      tl.fromTo("#s08-chip", { xPercent: -50, scale: 0, rotation: -3 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.52);
      tl.to("#s08-chip", { opacity: 0, y: 30, duration: 0.18, ease: "power2.in" }, 2.45);
      tl.to("#s08-trail", { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.25);
      tl.set({}, {}, 2.65);
      window.__timelines["s08"] = tl;

      // posizione dell'aereo e scia: funzione del tempo della scena (percorso SVG misurato una volta)
      const path = document.getElementById("s08-path");
      const trail = document.getElementById("s08-trail");
      const plane = document.getElementById("s08-plane");
      const L = path.getTotalLength();
      const easeIO = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      // la scia si "disegna" con una maschera: tratteggio fisso, lunghezza visibile = progresso
      trail.style.strokeDasharray = "";
      const draw = () => {
        const t = tl.time();
        const p = easeIO(Math.min(1, Math.max(0, (t - GO) / FLY)));
        const a = path.getPointAtLength(p * L);
        const b = path.getPointAtLength(Math.min(L, p * L + 2));
        const ang = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;
        const idle = t < GO ? Math.sin(t * 6) * 6 : 0;
        const pop = Math.min(1, Math.max(0, (t - 0.3) / 0.2));
        plane.style.transform = `translate(${a.x}px, ${a.y + idle}px) rotate(${ang + 45 - (t < GO ? 8 : 0)}deg) scale(${(0.6 + 0.4 * pop) * (1 + Math.sin(p * Math.PI) * 0.35)})`;
        plane.style.opacity = p >= 1 ? "0" : String(pop);
        // scia: tratteggio lime solo sulla parte già percorsa
        const done = p * L;
        trail.setAttribute("stroke-dasharray", dashes(done));
      };
      function dashes(len) {
        const out = [];
        let s = 0;
        while (s + 22 <= len) { out.push(22, 18); s += 40; }
        if (len - s > 0) out.push(Math.max(0.01, len - s), 0);
        out.push(0.01, L + 100);
        return out.join(" ");
      }
      window.addEventListener("hf-seek", draw);
      draw();
    })();
  </script>
</template>
