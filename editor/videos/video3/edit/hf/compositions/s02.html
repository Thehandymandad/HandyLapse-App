<template>
  <!-- s02 · "La parte più difficile di fare reel non è registrare." — pillola REC; su «registrare» (1,92) diventa lime con la spunta -->
  <style>
    #root { position: absolute; inset: 0; }
    #s02-pill { position: absolute; left: 286px; top: 1290px; width: 440px; height: 120px; }
    #s02-in { position: absolute; inset: 0; border-radius: 999px; background: var(--glass); border: 2px solid rgba(255,255,255,0.14);
      box-shadow: 0 30px 70px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 26px; padding: 0 40px; backdrop-filter: blur(22px); }
    #s02-dot { width: 46px; height: 46px; border-radius: 50%; background: #fff; flex: none; position: relative; }
    #s02-check { position: absolute; left: 7px; top: 7px; width: 32px; height: 32px; }
    #s02-rec { font: 900 52px var(--font-display); color: #fff; letter-spacing: -0.02em; }
    #s02-time { font: 700 44px var(--font-mono); color: rgba(255,255,255,0.7); margin-left: auto; font-variant-numeric: tabular-nums; }
    #s02-label { position: absolute; left: 286px; top: 1432px; width: 440px; text-align: center; font: 700 30px var(--font-mono);
      letter-spacing: 0.12em; color: var(--accent); }
  </style>
  <div id="root" data-composition-id="s02" data-width="1080" data-height="1920">
    <div id="s02-pill" class="clip" data-start="0" data-duration="2.55">
      <div id="s02-in">
        <div id="s02-dot"><svg id="s02-check" viewBox="0 0 24 24"><path id="s02-tick" d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#0B0B0C" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" opacity="0"/></svg></div>
        <div id="s02-rec">REC</div>
        <div id="s02-time">00:00</div>
      </div>
    </div>
    <div id="s02-label" class="clip" data-start="1.95" data-duration="0.6">LA PARTE FACILE</div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const HIT = 1.92;
      tl.fromTo("#s02-in", { scale: 0.6, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(1.6)" }, 0);
      // il punto REC pulsa finché si registra (3 battiti, ripetizione finita)
      tl.fromTo("#s02-dot", { scale: 1 }, { scale: 0.7, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0.2);
      // su «registrare»: tutto lime, spunta che si disegna
      tl.to("#s02-in", { backgroundColor: "#D4FF3A", borderColor: "#D4FF3A", duration: 0.12, ease: "power2.out" }, HIT);
      tl.to(["#s02-rec", "#s02-time"], { color: "#0B0B0C", duration: 0.12 }, HIT);
      tl.to("#s02-dot", { scale: 1.2, backgroundColor: "#FFFFFF", duration: 0.12, ease: "power3.out" }, HIT);
      tl.set("#s02-tick", { opacity: 1 }, HIT + 0.04);
      tl.to("#s02-tick", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, HIT + 0.04);
      tl.to("#s02-in", { scale: 1.08, duration: 0.06, ease: "power2.out" }, HIT);
      tl.to("#s02-in", { scale: 1, duration: 0.28, ease: "back.out(3)" }, HIT + 0.06);
      tl.fromTo("#s02-label", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 1.95);
      tl.to(["#s02-in", "#s02-label"], { opacity: 0, y: 30, filter: "blur(10px)", duration: 0.14, ease: "power2.in" }, 2.41);
      window.__timelines["s02"] = tl;
      // il timer conta i secondi di registrazione (funzione del tempo della scena)
      const time = document.getElementById("s02-time");
      window.addEventListener("hf-seek", () => {
        const t = Math.min(tl.time(), HIT);
        time.textContent = "00:0" + Math.floor(t * 1.1);
        document.getElementById("s02-rec").textContent = tl.time() >= HIT ? "FATTO" : "REC";
      });
    })();
  </script>
